# Integración continua (Lineamientos PI II §4.7): calidad y pruebas en cada push y PR.
# Las pruebas no requieren Ollama: usan dobles de los puertos (AGENTS.md §1).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar herramientas de desarrollo
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Formato (ruff format)
        run: ruff format --check .

      - name: Tipos (mypy --strict)
        run: mypy src tests scripts

      - name: Pruebas (pytest)
        run: pytest -q
