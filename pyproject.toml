[project]
name = "cardio-materno"
version = "0.0.0"
description = "Asistente de teleorientación con IA en salud cardiovascular y materno-infantil (Caldas)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []  # Se agregan a medida que se implementen las capas (ver ADR 0002)

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: errores, I: imports, N: nombres, D: docstrings, C90: complejidad, B: bugs, PL: pylint, SIM: simplificación
select = ["E", "F", "I", "N", "D", "C90", "B", "PL", "SIM", "UP"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 7

[tool.ruff.lint.pylint]
max-args = 5
max-statements = 25
max-branches = 6

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "conversational: pruebas de conversaciones de referencia (golden)",
    "integration: pruebas con adaptadores reales",
]
